[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zentao-ai-assistant"
version = "0.1.0"
description = "Open-source building blocks for a Zentao AI assistant."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Zentao AI Assistant contributors" }]
dependencies = [
  "typer>=0.12,<1",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "keyring>=25,<26",
  "httpx>=0.27,<1",
  "mcp>=1,<2",
  "platformdirs>=4,<5",
]

[project.scripts]
zentao-ai = "zentao_ai.cli.app:main"
zentao-ai-state = "zentao_ai.state.cli:main"
zentao-ai-repository = "zentao_ai.repository.cli:main"
zentao-ai-render-report = "zentao_ai.reporting.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "build",
  "twine",
]

[tool.hatch.build.targets.wheel]
packages = ["src/zentao_ai"]

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
