[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "zentao-ai-assistant"
version = "0.1.0"
description = "A local-first Codex plugin for querying and updating ZenTao bugs."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "wwtweiwenting"}]
keywords = ["codex", "mcp", "zentao", "bug-tracking"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "mcp>=1,<2",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "pytest-asyncio>=0.23,<1",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "twine>=5,<7",
  "types-PyYAML>=6,<7",
]

[project.scripts]
zentao-ai = "zentao_ai.cli:app"

[project.urls]
Repository = "https://github.com/wwtweiwenting/zentao-ai-assistant"
Issues = "https://github.com/wwtweiwenting/zentao-ai-assistant/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/zentao_ai"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["zentao_ai"]
