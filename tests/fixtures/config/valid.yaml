configVersion: 1
zentao:
  baseUrl: https://zentao.example.invalid
  account: example-user
  password: ${ZENTAO_PASSWORD}
personal:
  scopeNames: [example-web, example-api, example-ai-web, example-ai-api]
team:
  scopeNames: [example-web, example-ai-web, example-lowcode]
  members: [example-member]
limits:
  maxBugsPerRun: 50
repositories:
  example-web: &example_repo
    repository: example-monorepo
    path: repos/example-web
    targetBranch: main
    testCommands: [pytest]
  example-api:
    <<: *example_repo
    path: repos/example-api
  example-ai-web:
    <<: *example_repo
    path: repos/example-ai-web
  example-ai-api:
    <<: *example_repo
    path: repos/example-ai-api
  example-lowcode:
    <<: *example_repo
    path: repos/example-lowcode
permissions:
  codeWriteEnabled: false
  commentEnabled: false
  stepUpdateEnabled: false
reporting:
  outputDirectory: reports
  formats: [json]
schedule:
  timezone: Asia/Shanghai
  time: "08:00"
  includeWeekends: true
